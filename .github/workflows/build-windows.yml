name: Windows builds

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore x64 app
        run: dotnet restore .\src\DSO1102.Controller.App\DSO1102.Controller.App.csproj

      - name: Build x64 app
        run: dotnet build .\src\DSO1102.Controller.App\DSO1102.Controller.App.csproj -c Release --no-restore

      - name: Publish x64 app
        run: dotnet publish .\src\DSO1102.Controller.App\DSO1102.Controller.App.csproj -c Release -r win-x64 --self-contained true -o .\artifacts\DSO1102_Controller-win-x64

      - name: Restore x86 bridge
        run: dotnet restore .\src\DSO1102.Controller.Bridge\DSO1102.Controller.Bridge.csproj -r win-x86

      - name: Build x86 bridge
        run: dotnet build .\src\DSO1102.Controller.Bridge\DSO1102.Controller.Bridge.csproj -c Release -r win-x86 --no-restore

      - name: Publish x86 bridge
        run: dotnet publish .\src\DSO1102.Controller.Bridge\DSO1102.Controller.Bridge.csproj -c Release -r win-x86 --self-contained true --no-restore -o .\artifacts\DSO1102_Bridge-win-x86

      - uses: actions/upload-artifact@v4
        with:
          name: DSO1102_Controller-win-x64
          path: .\artifacts\DSO1102_Controller-win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: DSO1102_Bridge-win-x86
          path: .\artifacts\DSO1102_Bridge-win-x86
